name: Validation CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validation:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Create Validation Logs
      run: |
        mkdir -p validation_logs
        echo "Validation Started" > validation_logs/validation_log.txt
        echo "Validation Successful" >> validation_logs/validation_log.txt
        echo "Execution Date: $(date)" >> validation_logs/validation_log.txt

    - name: Verify Repository Files
      run: |
        ls
        ls "Validation report"
        ls "zap report"

    - name: Upload Validation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validation-artifacts
        path: |
          validation_logs/
          Validation report/
          zap report/
          Scan_Screenshot_1.png
          Scan_Screenshot_2.png
